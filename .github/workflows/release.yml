name: Release
# Push a tag like v0.2.0 (it must match package.json) to publish ghcr.io/m0ndez/my-missyoubibi-app and -bridge (amd64 + arm64) and
# create the GitHub release. The tests run first. A tag with a dash (v0.2.0-rc1) is a prerelease: it doesn't move `latest`.
# Each platform is built on a native runner (no QEMU) and pushed by digest; the merge job then stitches the digests into one tagged
# multi-platform image (https://docs.docker.com/build/ci/github-actions/multi-platform/).
on:
  push: { tags: ["v*"] }
permissions:
  contents: read # per job below: `images` and `merge` add packages: write, `release` adds contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: npm }
      - name: The tag must match package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check
      - run: npm audit --omit=dev
      - run: npm run build
      - run: npm run e2e

  images: # one job per image and platform, each on a runner of its own architecture; pushes by digest, no tags yet
    needs: test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions: { contents: read, packages: write }
    strategy:
      fail-fast: true
      matrix:
        target: [app, bridge]
        platform: [linux/amd64, linux/arm64]
        include:
          - { platform: linux/amd64, runner: ubuntu-24.04, arch: amd64 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm, arch: arm64 }
    env:
      REGISTRY_IMAGE: ghcr.io/m0ndez/my-missyoubibi-${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,"name=${{ env.REGISTRY_IMAGE }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.arch }}
      - name: Export the digest
        env: { DIGEST: "${{ steps.build.outputs.digest }}" }
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-${{ matrix.target }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge: # one multi-platform manifest per image, carrying the version tags
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: read, packages: write }
    strategy:
      matrix: { target: [app, bridge] }
    env:
      REGISTRY_IMAGE: ghcr.io/m0ndez/my-missyoubibi-${{ matrix.target }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.target }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Create the manifest list and push it
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tags < <(jq -r ".tags[]" <<< "$DOCKER_METADATA_OUTPUT_JSON")
          args=(); for t in "${tags[@]}"; do args+=(-t "$t"); done
          refs=(); for d in *; do refs+=("$REGISTRY_IMAGE@sha256:$d"); done
          docker buildx imagetools create "${args[@]}" "${refs[@]}"
      - name: Both platforms must be in the pushed image
        run: |
          out=$(docker buildx imagetools inspect "$REGISTRY_IMAGE:${{ steps.meta.outputs.version }}")
          echo "$out"
          grep -q 'Platform: *linux/amd64' <<< "$out"
          grep -q 'Platform: *linux/arm64' <<< "$out"

  release:
    needs: merge
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
      - run: gh release create "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
