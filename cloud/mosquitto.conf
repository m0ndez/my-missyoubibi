# Cloud deployment broker. Each listener has its own users and ACL (per_listener_settings), so the two accounts never mix.
per_listener_settings true

# Global. Messages here are tiny (a unit's state is under 1 KB): refuse anything bigger, and cap clients per listener below.
message_size_limit 65536
persistence true
persistence_location /mosquitto/data/

# Plain: compose network only (it is not published on the host). The web app logs in here as `app`.
listener 1883
allow_anonymous false
password_file /tmp/passwd-app
acl_file /mosquitto/config/acl
max_packet_size 65536
max_connections 20

# TLS: public, for the home bridge only (`device`). The certificate files are copied here by certbot's deploy hook; SIGHUP re-reads them.
# A changed listener needs a restart, not a reload.
listener 8883
allow_anonymous false
password_file /tmp/passwd-device
acl_file /mosquitto/config/acl
certfile /certs/fullchain.pem
keyfile /certs/privkey.pem
max_packet_size 65536
max_connections 20
