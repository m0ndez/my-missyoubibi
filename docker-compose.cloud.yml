# Cloud deployment, VPS side: `docker compose -f docker-compose.cloud.yml --env-file .env.cloud up -d`. Settings: .env.cloud.example.
# Broker listeners: 1883 plain, compose network only (the web app); 8883 TLS, public, the bridge's `device` user only.
# The web app is published only through the tunnel connector (outbound connection to Cloudflare): no web port is opened on the VPS.
# Cloudflare R2 through rclone, configured entirely from the environment (no config file). The bucket-scoped token cannot create
# buckets, hence NO_CHECK_BUCKET.
x-r2: &r2
  BACKUP_REMOTE: r2:${R2_BUCKET:?set it in .env.cloud}
  RCLONE_CONFIG_R2_TYPE: s3
  RCLONE_CONFIG_R2_PROVIDER: Cloudflare
  RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?set it in .env.cloud}
  RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?set it in .env.cloud}
  RCLONE_CONFIG_R2_ENDPOINT: https://${R2_ACCOUNT_ID:?set it in .env.cloud}.r2.cloudflarestorage.com
  RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"

services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    pid: "service:certbot" # joins certbot's PID namespace so its deploy hook can send SIGHUP to the broker
    # Only the TLS listener is published; 1883 is not.
    ports: ["8883:8883"]
    environment:
      MQTT_PASS: ${MQTT_PASS:?set it in .env.cloud}
      MQTT_DEVICE_PASS: ${MQTT_DEVICE_PASS:?set it in .env.cloud}
    # One password file per listener, so `app` can only log in on 1883 and `device` only on 8883.
    command:
      - sh
      - -c
      - |
        rm -f /tmp/passwd-app /tmp/passwd-device &&
        mosquitto_passwd -b -c /tmp/passwd-app app "$$MQTT_PASS" &&
        mosquitto_passwd -b -c /tmp/passwd-device device "$$MQTT_DEVICE_PASS" &&
        chown mosquitto /tmp/passwd-app /tmp/passwd-device &&
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    volumes:
      - ./cloud/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - mosquitto-data:/mosquitto/data
      - broker-certs:/certs:ro
    depends_on:
      certbot: { condition: service_healthy } # the TLS listener needs the certificate files to start
    healthcheck:
      test: ["CMD-SHELL", 'mosquitto_pub -h localhost -u app -P "$$MQTT_PASS" -t mhi/_health -m 1']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Issues the certificate and renews it. After every issue or renewal its deploy hook signals the broker to re-read the files.
  certbot:
    image: certbot/dns-cloudflare:v5.9.0@sha256:8216d4732d11772a9cf2fb30d022abf9eec7c83af2e33f002aa9e371c5192b67
    restart: unless-stopped
    entrypoint: ["/certbot.sh"]
    environment:
      BROKER_HOST: ${BROKER_HOST:?set it in .env.cloud}
      ACME_EMAIL: ${ACME_EMAIL:?set it in .env.cloud}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?set it in .env.cloud}
      ACME_STAGING: ${ACME_STAGING:-}
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, KILL] # install -o 1883 in the hook, and signalling the broker (another uid)
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp] # the Cloudflare token is written here: keep it off disk
    volumes:
      - ./cloud/certbot.sh:/certbot.sh:ro
      - ./cloud/deploy-hook.sh:/deploy-hook.sh:ro
      - letsencrypt:/etc/letsencrypt
      - broker-certs:/certs
    healthcheck:
      test: ["CMD-SHELL", "test -s /certs/privkey.pem"]
      interval: 10s
      timeout: 3s
      retries: 60 # first issuance can take a minute or two (DNS propagation)

  app:
    image: ghcr.io/m0ndez/my-missyoubibi-app:${VERSION:-latest}
    restart: unless-stopped
    depends_on:
      mosquitto: { condition: service_healthy }
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"] # non-2xx (broker unreachable) fails it
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # No `ports`: only the tunnel connector reaches it, over the compose network.
    environment:
      TZ: ${TZ:-UTC} # timers and daily energy totals use this timezone: keep it equal to the one the data was made under
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_USER: app
      MQTT_PASS: ${MQTT_PASS:?set it in .env.cloud}
      APP_PASSWORD: ${APP_PASSWORD:?set it in .env.cloud}
      AUTH_SECRET: ${AUTH_SECRET:?set it in .env.cloud}
      ALLOWED_HOSTS: ${APP_HOST:?set it in .env.cloud} # the app refuses any Host header that is not this name
      HA_DISCOVERY: ${HA_DISCOVERY:-}
      ENERGY_RATE: ${ENERGY_RATE:-}
      ENERGY_CURRENCY: ${ENERGY_CURRENCY:-}
    volumes: ["app-data:/data"]

  # Publishes the app at https://${APP_HOST} through Cloudflare (outbound only). The tunnel's public hostname, pointed at
  # http://app:3000, and the Access policy in front of it are set in the Cloudflare dashboard: docs/cloud-deployment.md.
  tunnel:
    image: cloudflare/cloudflared:2026.10.7@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set it in .env.cloud}
    depends_on:
      app: { condition: service_healthy }
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Copies the app's data to R2 every night (cloud/backup.sh). Restore: `docker compose --profile restore run --rm restore`, see docs/cloud-deployment.md.
  backup:
    image: rclone/rclone:1.75.2@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    user: "1000:1000" # the app's own user, so it can read every file in the volume and needs no capabilities
    environment:
      <<: *r2
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:mode=1777"] # the archive is built here, off disk
    volumes:
      - ./cloud/backup.sh:/backup.sh:ro
      - app-data:/data:ro

  # Not started by `up`. Fills an EMPTY app-data volume from the newest backup (or the archive named after `run --rm restore`).
  restore:
    image: rclone/rclone:1.75.2@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5
    profiles: [restore]
    entrypoint: ["/bin/sh", "/restore.sh"]
    environment: *r2
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER] # write into the volume's directory and give the files to the app's user
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:mode=1777"]
    volumes:
      - ./cloud/restore.sh:/restore.sh:ro
      - app-data:/data

volumes:
  mosquitto-data:
  letsencrypt:
  broker-certs:
  app-data:
