listener 1883
allow_anonymous false
# written by the compose command from MQTT_PASS / MQTT_DEVICE_PASS at every start
password_file /tmp/passwd
acl_file /mosquitto/config/acl
# Messages here are tiny (a unit's state is under 1 KB): refuse anything bigger, and cap clients.
max_packet_size 65536
message_size_limit 65536
max_connections 20
persistence true
persistence_location /mosquitto/data/
